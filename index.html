<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf6"><meta name="description" content="Plan a week of family meals with RANNU App.">
  <link rel="manifest" href="manifest.webmanifest?v=7"><link rel="icon" href="rannu-icon-192.png?v=7" type="image/png"><link rel="apple-touch-icon" href="rannu-apple-touch-icon.png?v=7">
  <title>RANNU App</title><link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#home" data-page="home"><img class="brand-logo" src="brand-logo.png" alt=""><span>RANNU <span class="brand-light">App</span></span></a>
    <div class="side-caption">MAIN MENU</div>
    <nav class="side-nav" aria-label="Main menu">
      <button data-page="home" class="nav-item active"><span class="nav-icon" data-icon="home"></span>Home</button>
      <button data-page="menus" class="nav-item"><span class="nav-icon" data-icon="menu"></span>Menu <span class="nav-count" id="menuCount">0</span></button>
      <button data-page="add" class="nav-item"><span class="nav-icon" data-icon="add"></span>Add a menu</button>
      <button data-page="schedule" class="nav-item"><span class="nav-icon" data-icon="schedule"></span>Schedule</button>
    </nav>
    <div class="side-bottom"><div class="sync-card"><span class="sync-dot"></span><div><strong>Google Sheets</strong><small>Apps Script endpoint ready</small></div></div><button data-page="settings" class="nav-item"><span class="nav-icon" data-icon="settings"></span>Settings</button></div>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="breadcrumb"><span class="breadcrumb-path">RANNU App <span>/</span> <b id="crumb">Home</b></span><span id="todayLabel" class="today-label"></span></div><div class="top-right"><a class="mobile-brand" href="#home" data-page="home" aria-label="RANNU App home"><img src="brand-logo.png" alt="RANNU App"></a><button class="avatar" title="Settings" aria-label="Settings" data-page="settings">R</button></div></header>
    <section id="page-home" class="page active"></section>
    <section id="page-menus" class="page"></section>
    <section id="page-add" class="page"></section>
    <section id="page-schedule" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
</div>
<nav class="mobile-nav" aria-label="Bottom navigation">
  <button data-page="home" class="mobile-item active"><span data-icon="home"></span>Home</button>
  <button data-page="menus" class="mobile-item"><span data-icon="menu"></span>Menu</button>
  <button data-page="add" class="mobile-item mobile-add"><span data-icon="add"></span><small>Add</small></button>
  <button data-page="schedule" class="mobile-item"><span data-icon="schedule"></span>Schedule</button>
  <button data-page="settings" class="mobile-item"><span data-icon="settings"></span>Settings</button>
</nav>
<div id="modalRoot"></div><div id="toast" class="toast" role="status"></div>
<script>
const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',menu:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',add:'<path d="M12 5v14M5 12h14"/>',schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/>'};
document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=`<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[el.dataset.icon]}</svg>`});
</script>
<script src="app.js?v=7"></script>
</body></html>
